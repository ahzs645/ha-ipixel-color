# iPIXEL Color services. Every service targets a panel or combined display
# (device, entity or area); the target may be omitted when only one is configured.

display_text:
  name: Display text
  description: Show text on a panel or combined display.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    text:
      name: Text
      description: Text to display (templates and \n are supported)
      required: true
      example: "Hello World"
      selector:
        text:
    mode:
      name: Mode
      description: text = rendered by the panel itself (scroll/blink animations), textimage = rendered by Home Assistant (one image over a combined display)
      required: false
      default: "text"
      selector:
        select:
          options:
            - "text"
            - "textimage"
    animation:
      name: Animation
      description: "Native text animation: 0 static, 1 scroll left, 2 scroll right, 3 up, 4 down, 5 blink, 6 fade, 7 snow (text mode only)"
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 7
          mode: box
    speed:
      name: Speed
      description: Animation speed 0-100 (text mode only)
      required: false
      default: 80
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    rainbow_mode:
      name: Rainbow
      description: Rainbow colour mode 0-9 (text mode only)
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 9
          mode: box
    color_fg:
      name: Text colour
      description: Text colour
      required: false
      default: [255, 255, 255]
      selector:
        color_rgb:
    color_bg:
      name: Background colour
      description: Background colour
      required: false
      default: [0, 0, 0]
      selector:
        color_rgb:
    font:
      name: Font
      description: UNIFONT (built-in) or a font file name from the fonts folder
      required: false
      example: "UNIFONT"
      selector:
        text:
    font_size:
      name: Font size
      description: Character height in pixels (0 = automatic)
      required: false
      selector:
        number:
          min: 0
          max: 128
          mode: box
          unit_of_measurement: "px"

update_display:
  name: Update display
  description: Re-render the current entity settings (mode, text, colours, font, ...) to the display.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color

display_image:
  name: Display image
  description: Show an image or GIF from a URL or a local file (spread over a combined display).
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    url:
      name: URL
      description: URL of a PNG/JPG/BMP/WEBP/GIF
      required: false
      example: "https://example.com/image.gif"
      selector:
        text:
    path:
      name: Path
      description: Local file path (must be in allowlist_external_dirs)
      required: false
      example: "/config/www/image.png"
      selector:
        text:
    method:
      name: Method
      description: upload = stored image/GIF upload (animated, default); stream = raw pixels, fast but still and not stored
      required: false
      default: "upload"
      selector:
        select:
          options:
            - "upload"
            - "stream"
    effect:
      name: Effect
      description: Image effect (blur, sharpen, invert, mirror, flip, grayscale, ...)
      required: false
      selector:
        text:
    slot:
      name: Storage slot
      description: Store in a slot 1-255 instead of showing directly (0, upload only)
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
    brightness:
      name: Brightness
      description: Scale the pixel values 1-100 (stream only)
      required: false
      default: 100
      selector:
        number:
          min: 1
          max: 100
          mode: slider
          unit_of_measurement: "%"

draw_solid_color:
  name: Draw solid colour
  description: Fill the whole display with one colour.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    color:
      name: Colour
      description: Hex colour (ff0000) or RGB list
      required: true
      example: "ff0000"
      selector:
        text:

draw_visuals:
  name: Draw visuals
  description: Render multiple elements (text, scrolling text, long text, images, pixels) with animation on the whole display.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    elements:
      name: Elements
      description: "List of elements. Types: text (content, x, y, color, font, font_size), textscroll (content, y, speed), textlong (content, x, y, speed, direction), image (source, x, y, width, height), pixels (data: [{x, y, color}])"
      required: true
      example: |
        - type: text
          content: "Hello"
          x: 0
          y: 0
          color: "ffffff"
        - type: textscroll
          content: "Scrolling message..."
          y: 8
          speed: 50
      selector:
        object:
    background:
      name: Background
      description: Background colour
      required: false
      default: [0, 0, 0]
      selector:
        color_rgb:
    fps:
      name: FPS
      description: Animation frames per second (1-30)
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 30
          mode: slider
    brightness:
      name: Brightness
      description: Scale the pixel values (1-100)
      required: false
      default: 100
      selector:
        number:
          min: 1
          max: 100
          mode: slider
          unit_of_measurement: "%"

stop_visuals:
  name: Stop visuals
  description: Stop a running draw_visuals animation.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color

set_power:
  name: Set power
  description: Turn the display on or off.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    "on":
      name: On
      description: true = on, false = off
      required: false
      default: true
      selector:
        boolean:

set_brightness:
  name: Set brightness
  description: Set the display brightness.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    level:
      name: Level
      description: Brightness 1-100
      required: true
      example: 50
      selector:
        number:
          min: 1
          max: 100
          mode: slider
          unit_of_measurement: "%"

set_orientation:
  name: Set orientation
  description: Rotate the display.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    orientation:
      name: Orientation
      description: Rotation in degrees
      required: true
      default: "0"
      selector:
        select:
          options:
            - "0"
            - "90"
            - "180"
            - "270"

set_upside_down:
  name: Set upside down
  description: Flip the display 180 degrees (for inverted mounting).
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    upside_down:
      name: Upside down
      description: true = flipped
      required: true
      default: false
      selector:
        boolean:

set_clock_mode:
  name: Set clock mode
  description: Show the built-in clock.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    style:
      name: Style
      description: Clock style 0-8
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 8
          mode: box
    show_date:
      name: Show date
      description: Show the date
      required: false
      default: true
      selector:
        boolean:
    format_24:
      name: 24-hour
      description: Use a 24 hour clock
      required: false
      default: true
      selector:
        boolean:
    date:
      name: Date
      description: Date as DD/MM/YYYY (today when empty)
      required: false
      example: "25/12/2024"
      selector:
        text:

set_rhythm_mode:
  name: Set rhythm mode
  description: Music visualiser. With levels the 11 frequency band levels are set explicitly.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    style:
      name: Style
      description: Visualiser style 0-4
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 4
          mode: box
    speed:
      name: Speed
      description: Animation speed 0-7
      required: false
      default: 4
      selector:
        number:
          min: 0
          max: 7
          mode: box
    levels:
      name: Levels
      description: "Optional: 11 band levels 0-15, comma separated"
      required: false
      example: "8,8,8,8,8,8,8,8,8,8,8"
      selector:
        text:

sync_time:
  name: Sync time
  description: Send the current time to the display.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color

set_time:
  name: Set time
  description: Set a specific time on the display.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    hour:
      name: Hour
      description: Hour 0-23
      required: true
      example: 12
      selector:
        number:
          min: 0
          max: 23
          mode: box
    minute:
      name: Minute
      description: Minute 0-59
      required: true
      example: 30
      selector:
        number:
          min: 0
          max: 59
          mode: box
    second:
      name: Second
      description: Second 0-59
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 59
          mode: box

set_pixel:
  name: Set pixel
  description: Set one pixel (coordinates of the whole combined display).
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    x:
      name: X
      description: Horizontal position
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 1023
          mode: box
    y:
      name: Y
      description: Vertical position
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 1023
          mode: box
    color:
      name: Colour
      description: Hex colour
      required: true
      example: "ff0000"
      selector:
        text:

set_pixels:
  name: Set pixels
  description: Set several pixels at once, batched per colour (coordinates of the whole combined display).
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    pixels:
      name: Pixels
      description: List of {x, y, color}
      required: true
      example: [{"x": 0, "y": 0, "color": "ff0000"}, {"x": 1, "y": 0, "color": "00ff00"}]
      selector:
        object:

clear_display:
  name: Clear display
  description: Blank the display without powering it off.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color

show_slot:
  name: Show slot
  description: Show content stored in a slot.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    slot:
      name: Slot
      description: Slot number 0-255
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 255
          mode: box

delete_slot:
  name: Delete slot
  description: Delete content stored in a slot.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    slot:
      name: Slot
      description: Slot number 0-255
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 255
          mode: box

erase_data:
  name: Erase data
  description: Erase stored slots/buffers.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    erase_all:
      name: Erase all
      description: Erase everything
      required: false
      default: false
      selector:
        boolean:
    buffers:
      name: Buffers
      description: Comma separated buffer numbers 1-255
      required: false
      example: "1,2,3"
      selector:
        text:

set_program_mode:
  name: Set program mode
  description: Cycle through stored screens.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    buffers:
      name: Buffers
      description: Comma separated buffer numbers 1-9
      required: true
      example: "1,2,3"
      selector:
        text:

set_screen:
  name: Set screen
  description: Select a stored screen buffer.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    screen:
      name: Screen
      description: Screen 1-9
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 9
          mode: box

set_diy_mode:
  name: Set DIY mode
  description: Control DIY mode.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    mode:
      name: Mode
      description: 0 exit keep previous, 1 enter clear, 2 exit keep current, 3 enter preserve
      required: true
      default: 1
      selector:
        number:
          min: 0
          max: 3
          mode: box

set_default_mode:
  name: Factory reset
  description: Erases every saved slot and the device settings (opcode 0x8003). Use clear_display to blank the screen.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color

add_schedule:
  name: Add schedule item
  description: Add an item to the content library used by playlists.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    name:
      name: Name
      description: Name of the item
      required: true
      example: "Morning message"
      selector:
        text:
    text:
      name: Text
      description: Text to display
      required: false
      example: "Good morning!"
      selector:
        text:
    mode:
      name: Mode
      description: Display mode
      required: false
      default: "textimage"
      selector:
        select:
          options:
            - "textimage"
            - "text"
            - "clock"
            - "gif"
            - "rhythm"
    url:
      name: Image URL
      description: URL for gif mode
      required: false
      selector:
        text:
    color_fg:
      name: Text colour
      description: Text colour
      required: false
      selector:
        color_rgb:
    color_bg:
      name: Background colour
      description: Background colour
      required: false
      selector:
        color_rgb:
    duration_ms:
      name: Duration
      description: How long to show the item
      required: false
      default: 5000
      selector:
        number:
          min: 1000
          max: 3600000
          mode: box
          unit_of_measurement: "ms"
    slot:
      name: Slot
      description: Show a stored slot instead of sending content
      required: false
      selector:
        number:
          min: 0
          max: 255
          mode: box
    schedule_id:
      name: Schedule id
      description: Optional fixed id (generated when empty)
      required: false
      selector:
        text:

remove_schedule:
  name: Remove schedule item
  description: Remove an item from the content library.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    schedule_id:
      name: Schedule id
      description: Id of the item
      required: true
      selector:
        text:

trigger_schedule:
  name: Trigger schedule item
  description: Show an item from the library now.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    schedule_id:
      name: Schedule id
      description: Id of the item
      required: true
      selector:
        text:

set_playlist:
  name: Set playlist
  description: Set the order of the default playlist.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    schedule_ids:
      name: Schedule ids
      description: Comma separated ids
      required: true
      example: "morning,weather,time"
      selector:
        text:

create_playlist:
  name: Create playlist
  description: Create a new playlist.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    name:
      name: Name
      description: Playlist name
      required: true
      example: "Morning"
      selector:
        text:
    schedule_ids:
      name: Schedule ids
      description: Items to add (list or comma separated)
      required: false
      selector:
        object:
    loop:
      name: Loop
      description: Loop the playlist
      required: false
      default: true
      selector:
        boolean:
    shuffle:
      name: Shuffle
      description: Random order
      required: false
      default: false
      selector:
        boolean:

start_playlist:
  name: Start playlist
  description: Start a playlist (the active one when no id is given).
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    playlist_id:
      name: Playlist id
      description: Playlist id
      required: false
      selector:
        text:

stop_playlist:
  name: Stop playlist
  description: Stop the running playlist.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color

set_power_schedule:
  name: Set power schedule
  description: Automatically power the display on and off.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    enabled:
      name: Enabled
      description: Enable the schedule
      required: false
      default: true
      selector:
        boolean:
    on_time:
      name: On time
      description: HH:MM
      required: false
      default: "07:00"
      selector:
        time:
    off_time:
      name: Off time
      description: HH:MM
      required: false
      default: "22:00"
      selector:
        time:
    days:
      name: Days
      description: Days of week (mon..sun)
      required: false
      example: ["mon", "tue", "wed", "thu", "fri"]
      selector:
        object:

add_time_slot:
  name: Add time slot
  description: Play a playlist during a time window.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    name:
      name: Name
      description: Slot name
      required: true
      example: "Morning shift"
      selector:
        text:
    playlist_id:
      name: Playlist id
      description: Playlist to play
      required: true
      selector:
        text:
    start_time:
      name: Start
      description: HH:MM
      required: true
      example: "08:00"
      selector:
        time:
    end_time:
      name: End
      description: HH:MM
      required: true
      example: "12:00"
      selector:
        time:
    days:
      name: Days
      description: Days of week (mon..sun)
      required: false
      selector:
        object:
    priority:
      name: Priority
      description: Higher wins
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 100
          mode: box

send_raw_command:
  name: Send raw command
  description: Send raw bytes (expert use).
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    hex_data:
      name: Hex data
      description: Hex string
      required: true
      example: "05 00 07 01 01"
      selector:
        text:

send_mix_data:
  name: Send mixed data
  description: Send raw mixed PNG/GIF/TEXT blocks (advanced).
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    hex_data:
      name: Hex data
      description: Mixed data blocks as hex
      required: true
      selector:
        text:
          multiline: true
    screen_slot:
      name: Screen slot
      description: Storage slot 1-255
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 255
          mode: box

set_password:
  name: Set password
  description: Enable/disable password protection.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    enabled:
      name: Enabled
      description: Enable
      required: true
      default: true
      selector:
        boolean:
    password:
      name: Password
      description: 6 digits
      required: true
      example: "123456"
      selector:
        text:

verify_password:
  name: Verify password
  description: Unlock a password protected panel.
  target:
    device:
      integration: ipixel_color
    entity:
      integration: ipixel_color
  fields:
    password:
      name: Password
      description: 6 digits
      required: true
      example: "123456"
      selector:
        text:

